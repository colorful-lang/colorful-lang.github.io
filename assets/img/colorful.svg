<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Colorful language logo">
  <title>Colorful (.cf)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B2A6F"/>
      <stop offset="45%"  stop-color="#1450C8"/>
      <stop offset="100%" stop-color="#2F9BFF"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F2FF"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9FD4FF"/>
      <stop offset="100%" stop-color="#5FB2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#041133" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="none" stroke="#0A1F52" stroke-width="4" opacity="0.55"/>

  <!-- main letter C -->
  <path d="M195 74
           C177 56 152 47 126 47
           C82 47 50 82 50 128
           C50 174 82 209 126 209
           C152 209 177 200 195 182
           L167 152
           C156 164 142 170 128 170
           C103 170 87 152 87 128
           C87 104 103 86 128 86
           C142 86 156 92 167 104
           Z"
        fill="url(#cg)" filter="url(#shadow)"/>

  <!-- lowercase f overlapping the bottom-right of the C -->
  <g transform="translate(150 118) rotate(-9)">
    <path d="M46 16
             C46 6 54 -1 66 -1
             C72 -1 78 1 82 4
             L76 24
             C74 23 72 22 70 22
             C66 22 64 25 64 30
             L64 40
             L86 40
             L82 61
             L64 61
             L64 128
             L40 128
             L40 61
             L22 61
             L26 40
             L40 40
             L40 30
             C40 24 42 20 46 16
             Z"
          fill="url(#fg)" stroke="#0A2E6B" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
